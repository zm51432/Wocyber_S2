# =============================================================
# /etc/fan-control.conf —— 风扇控制默认配置
#
# 这是【开机默认】。页面 / fanctl 在运行期的临时调整写在
#   /var/lib/fan-control/mode
#   /var/lib/fan-control/level
# 运行态文件优先级高于本文件；删掉运行态文件即回到本文件的默认值。
# 若要让页面设置的挡位重启后仍保留，让页面同时改本文件的 MODE/MANUAL_LEVEL。
# =============================================================

# 模式：auto=按温度自动；manual=固定挡位
MODE=auto

# manual 模式下的固定挡位（0-15，0=停转，15=全速）
MANUAL_LEVEL=6

# ---- 硬盘温控曲线（机械盘/SSD 安全温度比 CPU 低得多）----
# < HDD_TEMP_OFF               停转（0 挡）
# HDD_TEMP_OFF ~ LOW           低速（1 挡）
# LOW ~ MID                    线性 1 → 10 挡
# MID ~ MAX                    线性 10 → 15 挡
# >= HDD_TEMP_MAX              全速（15 挡）
HDD_TEMP_OFF=40
HDD_TEMP_LOW=45
HDD_TEMP_MID=55
HDD_TEMP_MAX=60

# ---- CPU 温控曲线（兜底，与硬盘曲线取较高挡位）----
TEMP_OFF=60
TEMP_LOW=65
TEMP_MID=80
TEMP_CRITICAL=100

# ---- 风扇电气参数 ----
FAN_DUTY_MIN=60      # 最低占空比 %（此风扇 50% 以下不转）
PWM_PERIOD=40000     # 25kHz
PWM_POLARITY=normal
USE_GPIO_FORCE=0     # 1=强制用 GPIO 备用方案

# ---- 采样 ----
CHECK_INTERVAL=3         # 采样间隔（秒）
TEMP_DEBOUNCE_CNT=2      # 连续 N 次目标挡位不同才真正调整（去抖）
HDD_SMART_CYCLES=10      # 无 hwmon 时，每 N 个周期用 smartctl 问一次（10×3s=30s）
HDD_SMART_TIMEOUT=8      # 单次 smartctl 超时（秒）
