# power-led-net.conf —— 电源灯网络状态指示的可调参数
#
# 行为：网线插上（网卡 carrier=1）→ 绿灯常亮；没插网线/链路断开 → 红灯闪烁。
# 改完执行： systemctl restart power-led-net

# 主循环节拍（秒）。闪烁与检测都以它为单位，改小更灵敏、改大更省 CPU。
TICK=0.25

# 每几个节拍检测一次链路：8 × 0.25s = 每 2 秒检测一次
CHECK_EVERY=8

# 红灯闪烁节奏：亮 2 拍 + 灭 2 拍 = 0.5s 亮 / 0.5s 灭，周期 1s
BLINK_ON_TICKS=2
BLINK_OFF_TICKS=2

# 是否写日志（/var/log/power-led-net.log + syslog），只在状态切换时记一条
LOG_ENABLE=1
