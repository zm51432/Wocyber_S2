# /etc/sata-led.conf —— 硬盘指示灯参数（可选，改完重启 sata-led-manager 生效）
#
# 生效命令： systemctl restart sata-led-manager
#
# 当前策略：检测不到硬盘 → 红绿全灭；检测到硬盘 → 绿灯常亮（默认）。

# ---- GPIO 编号（本板确认）----
# 146=盘1红 147=盘1绿 148=盘2红 149=盘2绿 86=总开关
R1=146
G1=147
R2=148
G2=149
SW=86

# ---- 节拍 ----
TICK=1                # 检测节拍（秒），只在槽位状态变化时才写 GPIO

# ---- 有盘时的灯态 ----
# 1 = 检测到硬盘时由本服务控制灯（按下面 PRESENT_* 电平），默认亮绿灯
# 0 = 检测到硬盘时本服务完全不碰 GPIO，把灯的控制权交回系统/飞牛
KEEP_OFF_WHEN_PRESENT=1

# KEEP_OFF_WHEN_PRESENT=1 时生效：有盘状态下红灯 / 绿灯的电平
# 默认 0 / 1 = 检测到硬盘即绿灯常亮；
# 想回到「有盘也全灭」（老 v5 行为）就改成 PRESENT_GREEN=0；
# 想红灯指示就改 PRESENT_RED=1。
PRESENT_RED=0
PRESENT_GREEN=1
